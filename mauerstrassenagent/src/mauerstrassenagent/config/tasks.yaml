strategy_task:
  description: >
    Interview the user to collect their investment parameters:
    1. Available capital (in USD or EUR)
    2. Risk tolerance — conservative, moderate, or aggressive
    3. Investment time-frame — short (<1 year), mid (1-5 years), long (5+ years)

    Use the knowledge base of investment strategies, risk frameworks, and
    sector analysis to validate the user's answers. If the profile has
    contradictions (e.g., aggressive risk with a 3-month horizon), educate
    the user and adjust. Produce a structured investment strategy including
    recommended strategy type and 2-3 sectors to focus on.
  expected_output: >
    A structured investment strategy containing: capital amount, risk level,
    investment horizon, recommended strategy type (value / growth / momentum /
    dividend), and 2-3 relevant sectors to focus on.
  agent: strategy_advisor
  human_input: true

trend_task:
  description: >
    Based on the investment strategy produced by the strategy advisor,
    search the web for 5 current market trends that match the user's risk
    level, horizon, and recommended sectors. For each trend provide:
    trend name, a 1-paragraph description, and why it fits the strategy.
    Present the 5 trends and let the user choose one or more to pursue.
  expected_output: >
    5 market trends with descriptions and rationale, followed by the
    user's selection of which trends to invest in.
  agent: market_analyst
  human_input: true

screening_task:
  description: >
    For each trend the user selected, search the web for the top 5 stocks
    best positioned to benefit. For each stock provide: ticker symbol,
    company name, 2-sentence business description, and 1-sentence
    motivation explaining why this stock fits the trend. Consider the
    risk profile when filtering — no speculative micro-caps for
    conservative profiles.
  expected_output: >
    A list of stock candidates grouped by trend. Each entry has: ticker,
    company name, description (2 sentences), motivation (1 sentence).
    Maximum 5 stocks per trend.
  agent: stock_screener

checker_task:
  description: >
    For each stock candidate from the screening, use the Finnhub financial
    data tools to validate fundamentals. Pull company profiles, basic
    financial metrics, reported financials, and recent SEC filings.
    Check filing sentiment. Complement with a web search when the Finnhub
    data is insufficient. Produce a validation report per stock with a
    go / no-go recommendation.
  expected_output: >
    Per-stock validation report containing: company profile summary, key
    financial metrics (P/E, margins, debt ratios, revenue trend), filing
    sentiment, notable risk factors, and a go / no-go recommendation
    with clear reasoning.
  agent: stock_checker

portfolio_task:
  description: >
    Using the investment strategy and the validated stock data, construct
    a final portfolio recommendation. For each recommended stock provide:

    - Ticker symbol
    - Trend it belongs to
    - Allocation percentage (total must equal 100 %)
    - Approximate number of shares to buy (based on user's capital)
    - Recommended buy price (current market price)
    - Stop-loss price
    - Brief rationale for the weight

    Present the portfolio as a clean markdown table. Add a summary
    paragraph explaining the overall strategy, diversification, and any
    caveats. Flag concentration risks.
  expected_output: >
    A markdown table with columns: Ticker | Trend | Allocation % | Shares |
    Buy Price | Stop-Loss | Rationale. Plus a summary paragraph explaining
    the portfolio strategy and any caveats.
  agent: portfolio_builder
