strategy_task:
  description: >
    Collect the user's investment parameters: available capital, risk
    tolerance (conservative/moderate/aggressive), and investment horizon
    (short <1y, mid 1-5y, long 5y+). Use the knowledge base to validate
    their choices — if the profile has contradictions (e.g., aggressive
    risk with 3-month horizon), educate and adjust. Output a structured
    investment profile.
  expected_output: >
    A structured investment profile containing: capital amount, risk level,
    investment horizon, recommended strategy type (value/growth/momentum/
    dividend), and 2-3 relevant sectors to focus on.
  agent: strategy_advisor
  human_input: true

trend_task:
  description: >
    Based on the investment profile from the strategy task, search for
    current market trends that match the user's risk level and horizon.
    Find 5 trends, each with: trend name, 1-paragraph description, and
    why it fits the profile. Present them to the user for selection.
  expected_output: >
    5 market trends with descriptions and rationale, followed by the
    user's selection of 1-3 trends to pursue further.
  agent: market_analyst
  human_input: true

screening_task:
  description: >
    For each trend the user selected, find the top 5 stocks that are
    best positioned to benefit. For each stock provide: ticker symbol,
    company name, 2-sentence description of the business, and 1-sentence
    motivation explaining why this stock fits the trend. Consider the
    risk profile when filtering — no speculative micro-caps for
    conservative profiles.
  expected_output: >
    A list of stock candidates grouped by trend. Each entry has: ticker,
    company name, description (2 sentences), motivation (1 sentence).
    Maximum 5 stocks per trend.
  agent: stock_screener

checker_task:
  description: >
    For each stock candidate from the screening, use the Finnhub MCP
    tools to validate fundamentals:
    1. get_company_profile — confirm sector, market cap, exchange
    2. get_basic_financials — pull P/E, margins, debt ratios, 52-week range
    3. get_financials_reported — get annual income statement, balance sheet,
       cash flow as reported
    4. search_in_filing — search the latest 10-K for "risk factors",
       "forward guidance", "revenue growth"
    5. get_filing_sentiment — check for abnormal language shifts vs prior year
    Produce a validation report per stock with a go/no-go recommendation.
    If Finnhub has no data for a stock, use Serper as fallback.
  expected_output: >
    Per-stock validation report containing: key financial metrics, revenue
    and profit trends, notable risk factors, sentiment flag (normal/abnormal),
    and a go/no-go recommendation with reasoning.
  agent: report_checker

portfolio_task:
  description: >
    Using the investment profile and validated stock data, construct a
    portfolio recommendation. For each recommended stock: allocation
    percentage, approximate number of shares (based on the user's capital),
    and a rationale for the weight. Ensure diversification across trends
    and flag any concentration risk. The total allocation must equal 100%.
  expected_output: >
    A portfolio table with columns: stock ticker, trend, allocation %,
    approximate shares, rationale. Plus a summary paragraph explaining
    the overall portfolio strategy and any caveats.
  agent: portfolio_builder
