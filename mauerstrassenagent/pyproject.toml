[project]
name = "mauerstrassenagent"
version = "0.1.0"
description = "MauerstrassenAgent — AI Financial Manager Crew"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.10.1",
    "mcp",
    "httpx",
]

[project.scripts]
mauerstrassenagent = "mauerstrassenagent.main:run"
run_crew = "mauerstrassenagent.main:run"
train = "mauerstrassenagent.main:train"
replay = "mauerstrassenagent.main:replay"
test = "mauerstrassenagent.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
