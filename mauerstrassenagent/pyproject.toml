[project]
name = "mauerstrassenagent"
version = "0.1.0"
description = "mauerstrassenAgent using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.10.1"
]

[project.scripts]
mauerstrassenagent = "mauerstrassenagent.main:run"
run_crew = "mauerstrassenagent.main:run"
train = "mauerstrassenagent.main:train"
replay = "mauerstrassenagent.main:replay"
test = "mauerstrassenagent.main:test"
run_with_trigger = "mauerstrassenagent.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
